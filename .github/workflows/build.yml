name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --quiet pillow

      - name: Check image derivatives
        run: python tools/images.py --check

      - name: Build manifest
        run: node tools/build.mjs

      - name: Manifest must be committed
        run: git diff --exit-code -- data/manifest.json
