name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build manifest
        run: node tools/build.mjs
      - name: Manifest must be committed
        run: git diff --exit-code -- data/manifest.json
